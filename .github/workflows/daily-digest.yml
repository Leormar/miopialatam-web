name: Digest MML diario

on:
  schedule:
    # 7:00 AM Colombia (UTC-5) = 12:00 UTC, con respaldos por si GitHub
    # demora/saltea el cron principal. El candado de idempotencia del script
    # (last_sent_date) garantiza un solo email por día aunque disparen varios.
    - cron: '0 12 * * *'    # 7:00 AM Colombia (principal)
    - cron: '20 12 * * *'   # 7:20 AM (respaldo 1)
    - cron: '40 12 * * *'   # 7:40 AM (respaldo 2)
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar envío aunque ya se haya mandado hoy (FORCE_SEND)'
        type: boolean
        default: false

# Evita que dos runs solapados pisen el push del estado.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run daily digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          FORCE_SEND: ${{ inputs.force && '1' || '' }}
        run: python scripts/daily_digest.py

      - name: Commit updated state and snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_seen.json data/digest-latest.json index.html
          if git diff --staged --quiet; then
            echo "no state/snapshot change"
            exit 0
          fi
          git commit -m "chore(digest): update state + snapshot $(date -u +%Y-%m-%d)"
          # Push resiliente: rebase sobre lo último de remoto y reintentar.
          for attempt in 1 2 3; do
            if git push; then
              echo "push ok (intento $attempt)"
              exit 0
            fi
            echo "push rechazado (intento $attempt); rebase y reintento..."
            git pull --rebase --autostash origin main
          done
          echo "::error::no se pudo pushear el estado tras 3 intentos"
          exit 1
